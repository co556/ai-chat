<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>AI 视频生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a14;--bg2:#12121e;--bg3:#1a1a2e;--border:#252540;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--accent:#8b5cf6;--safe-b:env(safe-area-inset-bottom,0px)}
body{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;-webkit-font-smoothing:antialiased}
#app{max-width:600px;margin:0 auto;padding:20px 16px calc(20px + var(--safe-b))}
h1{font-size:24px;font-weight:800;text-align:center;margin-bottom:4px;background:linear-gradient(135deg,#f59e0b,#ef4444,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:var(--text3);font-size:13px;margin-bottom:20px}
.section{margin-bottom:18px}
.section-title{font-size:14px;font-weight:700;color:var(--text2);margin-bottom:8px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:4px}
.fg input,.fg textarea,.fg select{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg3);color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:border-color .15s;-webkit-appearance:none}
.fg input:focus,.fg textarea:focus{border-color:var(--accent)}
.fg textarea{resize:vertical;min-height:70px;line-height:1.6}
.fg small{display:block;font-size:11px;color:var(--text3);margin-top:4px}
.btn{width:100%;padding:14px;border-radius:12px;border:none;font-weight:700;cursor:pointer;font-size:16px;transition:all .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--accent),#6366f1);color:#fff}
.btn-gold{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff}
.btn:disabled{opacity:.4;pointer-events:none}
.result-box{margin-top:16px;border-radius:14px;overflow:hidden;background:var(--bg2);border:1px solid var(--border)}
.result-box video{width:100%;display:block}
.result-box .placeholder{text-align:center;padding:60px 20px;color:var(--text3)}
.status{text-align:center;padding:12px;font-size:14px;color:var(--gold);font-weight:600}
.status.error{color:#ef4444}.status.success{color:#22c55e}
.prompt-preview{padding:14px;border-radius:10px;background:var(--bg2);border:1px solid var(--border);font-size:14px;line-height:1.7;color:var(--text2);margin-top:8px;display:none}
.prompt-preview.show{display:block}
.debug-box{margin-top:12px;padding:12px;border-radius:10px;background:#1a1a0a;border:1px solid #3a3a1a;font-size:11px;color:#a0a080;font-family:monospace;white-space:pre-wrap;word-break:break-all;display:none;max-height:200px;overflow-y:auto}
.debug-box.show{display:block}
.spinner{display:none;width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
.spinner.active{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
<h1>🎬 AI 视频生成器</h1>
<div class="sub">文字描述 → AI扩写 → 生成视频</div>

<div class="section"><div class="section-title">🔑 API 设置</div>
<div class="fg"><label>DeepSeek API Key</label><input type="password" id="dsKey" placeholder="sk-..."></div>
<div class="fg"><label>Replicate API Token</label><input type="password" id="repToken" placeholder="r8_..."><small>在 <a href="https://replicate.com/account/api-tokens" target="_blank" style="color:var(--accent)">replicate.com/account</a> 创建，新用户有免费额度</small></div>
<div class="fg"><label>CORS 代理</label><input type="text" id="corsProxy" value="http://localhost:8765/"><small>本地用 http://localhost:8765/，线上用 https://corsproxy.io/?</small></div>
</div>

<div class="section"><div class="section-title">📝 视频描述</div>
<div class="fg"><label>用简单的话描述你想生成的画面</label><textarea id="userPrompt" rows="3" placeholder="例如：一只橘猫坐在屋顶上，背后是橙色的夕阳，风吹过它的毛发..."></textarea></div>
<div style="display:flex;gap:8px">
<div class="fg" style="flex:1"><label>时长</label><select id="duration"><option value="5">5秒</option><option value="10" selected>10秒</option></select></div>
<div class="fg" style="flex:1"><label>比例</label><select id="aspectRatio"><option value="16:9" selected>16:9</option><option value="9:16">9:16</option></select></div>
</div>
<button class="btn btn-primary" id="btnEnhance" onclick="enhancePrompt()">🤖 DeepSeek 扩写脚本</button>
<div class="prompt-preview" id="promptPreview"></div>
</div>

<button class="btn btn-gold" id="btnGenerate" onclick="generateVideo()" disabled>🎬 生成视频</button>
<div class="spinner" id="spinner"></div>
<div class="status" id="status"></div>
<div class="debug-box" id="debugBox"></div>

<div class="result-box" id="resultBox">
<div class="placeholder"><div style="font-size:48px;margin-bottom:8px">🎥</div><div>视频生成后将显示在这里</div></div>
</div>
</div>

<script>
let enhancedPrompt='',currentVideoUrl='';

// Init
document.getElementById('dsKey').value=localStorage.getItem('av_ds')||'';
document.getElementById('repToken').value=localStorage.getItem('av_rep')||'';
document.getElementById('corsProxy').value=localStorage.getItem('av_proxy')||'http://localhost:8765/';

function apiFetch(url,options){
const proxy=document.getElementById('corsProxy').value.trim();
if(proxy){return fetch(proxy+encodeURIComponent(url),options)}
return fetch(url,options);
}

async function enhancePrompt(){
const key=document.getElementById('dsKey').value.trim();
if(!key){alert('请填入DeepSeek API Key');return}
const prompt=document.getElementById('userPrompt').value.trim();
if(!prompt){alert('请先输入视频描述');return}
localStorage.setItem('av_ds',key);
const btn=document.getElementById('btnEnhance');btn.disabled=true;btn.textContent='⏳ 扩写中...';
setStatus('DeepSeek 扩写中...');
try{
const resp=await apiFetch('https://api.deepseek.com/v1/chat/completions',{
method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
body:JSON.stringify({model:'deepseek-chat',messages:[
{role:'system',content:'你是AI视频脚本师。把用户的话扩展成详细视频提示词：画面构图、光线、动作、色彩、镜头风格。200字以内，直接输出。'},
{role:'user',content:prompt}
],temperature:0.8,max_tokens:400})
});
if(!resp.ok)throw new Error('DeepSeek错误 HTTP '+resp.status);
const data=await resp.json();
enhancedPrompt=data.choices[0].message.content.trim();
document.getElementById('promptPreview').textContent='✨ 优化后：\n\n'+enhancedPrompt;
document.getElementById('promptPreview').classList.add('show');
document.getElementById('btnGenerate').disabled=false;
setStatus('✅ 脚本就绪');
}catch(e){setStatus('❌ '+e.message,'error')}
btn.disabled=false;btn.textContent='🤖 DeepSeek 扩写脚本';
}

async function generateVideo(){
const token=document.getElementById('repToken').value.trim();
if(!token){alert('请填入 Replicate API Token');return}
const prompt=enhancedPrompt||document.getElementById('userPrompt').value.trim();
if(!prompt){alert('请先输入视频描述');return}

localStorage.setItem('av_rep',token);
localStorage.setItem('av_proxy',document.getElementById('corsProxy').value.trim());

const btn=document.getElementById('btnGenerate');btn.disabled=true;btn.textContent='⏳ 生成中...';
document.getElementById('spinner').classList.add('active');
document.getElementById('debugBox').classList.remove('show');
setStatus('🎬 创建视频任务...');

try{
const dur=parseInt(document.getElementById('duration').value);
const resp=await apiFetch('https://api.replicate.com/v1/models/lucataco/hotshot-xl/predictions',{
method:'POST',
headers:{'Content-Type':'application/json','Authorization':'Token '+token},
body:JSON.stringify({
input:{prompt:prompt,negative_prompt:'blurry,distorted,ugly,bad quality,low quality',width:672,height:384}
})
});
const data=await resp.json();
debugLog('Create',resp.status,JSON.stringify(data).slice(0,500));

if(!resp.ok)throw new Error(data.detail||data.error||'HTTP '+resp.status);
const predId=data.id;
if(!predId)throw new Error('无prediction ID: '+JSON.stringify(data));

// Poll
for(let i=0;i<60;i++){
await sleep(3000);
const pr=await apiFetch('https://api.replicate.com/v1/predictions/'+predId,{
headers:{'Authorization':'Token '+token}
});
const pd=await pr.json();
const st=pd.status;
setStatus('🎬 '+st+' ('+((i+1)*3)+'秒)');

if(st==='succeeded'){
const url=pd.output;
const videoUrl=typeof url==='string'?url:Array.isArray(url)?url[0]:url?.video;
if(videoUrl){currentVideoUrl=videoUrl;showVideo(videoUrl);setStatus('✅ 生成成功！','success')}
else throw new Error('视频URL为空');
btn.disabled=false;btn.textContent='🎬 生成视频';document.getElementById('spinner').classList.remove('active');return;
}else if(st==='failed'||st==='canceled'){
throw new Error(pd.error||'生成失败');
}
}
throw new Error('超时，3分钟还没好');
}catch(e){setStatus('❌ '+e.message,'error');debugLog('ERROR',0,e.message)}
btn.disabled=false;btn.textContent='🎬 生成视频';document.getElementById('spinner').classList.remove('active');
}

async function createJWT(header,payload,secret){
const enc=b=>btoa(JSON.stringify(b)).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
const h=enc(header),p=enc(payload);
const encoder=new TextEncoder();
const key=await crypto.subtle.importKey('raw',encoder.encode(secret),{name:'HMAC',hash:'SHA-256'},false,['sign']);
const sig=await crypto.subtle.sign('HMAC',key,encoder.encode(h+'.'+p));
const s=btoa(String.fromCharCode(...new Uint8Array(sig))).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
return h+'.'+p+'.'+s;
}

function showVideo(url){
document.getElementById('resultBox').innerHTML='<video controls autoplay loop src="'+url+'"></video>';
}
function setStatus(msg,type){
const el=document.getElementById('status');el.textContent=msg;el.className='status'+(type?' '+type:'');
}
function debugLog(label,status,body){
const el=document.getElementById('debugBox');
el.classList.add('show');
el.textContent=('['+new Date().toLocaleTimeString()+'] '+label+' HTTP '+status+'\n'+body.slice(0,500)+'\n\n'+el.textContent).slice(0,3000);
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
</script>
</body>
</html>
